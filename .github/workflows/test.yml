name: test

# Every push to main and every pull request: formatting, vet, the full test
# suite (the promise tests on every fixture at every budget, robustness,
# the store and the command) on Linux, macOS and Windows, the race detector and the
# browser demo's WebAssembly build on Linux,
# the release plan's cases, and the smoke check on a Windows binary on a
# Windows runner. A passing run on main starts the release workflow, which
# releases a raised version.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Byte-exact fixtures and gofmt need the files as committed.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | tee test-output.txt
      - name: Report test failures as annotations
        # Job logs can't always be downloaded where this repo is worked on;
        # annotations can.
        if: failure()
        run: |
          grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:' test-output.txt | head -n 10 |
            while IFS= read -r line; do echo "::error title=go test::$line"; done || true
      - if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
      - run: go build ./...
      - name: The browser demo's WebAssembly build
        if: runner.os == 'Linux'
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./cmd/abbreviatory-wasm && go build -o /dev/null ./cmd/abbreviatory-wasm
      - if: runner.os != 'Windows'
        run: python3 -B -m unittest discover -s scripts -p '*_test.py'
      - name: Smoke check
        if: runner.os != 'Windows'
        run: |
          mkdir bin
          CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o bin/abbreviatory ./cmd/abbreviatory
          python3 scripts/smoke.py bin

  # The Windows binary, built as the release builds it, runs the smoke check
  # on a Windows runner on every push and pull request, so a Windows problem
  # shows here rather than first in a release.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          mkdir bin
          go build -trimpath -ldflags '-s -w' -o bin/abbreviatory.exe ./cmd/abbreviatory
      - uses: actions/upload-artifact@v7
        with:
          name: windows-test-binaries
          path: bin
          retention-days: 3

  windows-smoke:
    needs: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-test-binaries
          path: bin
      - name: Smoke check
        shell: pwsh
        run: |
          python scripts/smoke.py bin
          if ($LASTEXITCODE -ne 0) { throw "smoke check failed" }
