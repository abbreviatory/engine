// Built offline: JUnit 4 comes from Gradle's own lib folder.
plugins { id 'java' }

java { toolchain { languageVersion = JavaLanguageVersion.current() } }

dependencies {
    testImplementation files("${gradle.gradleHomeDir}/lib/junit-4.13.2.jar", "${gradle.gradleHomeDir}/lib/hamcrest-core-1.3.jar")
}

test {
    useJUnit()
    testLogging { events "failed"; exceptionFormat "short" }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs << "-Xlint:all" }

// gradle -Pbroken compileJava adds code that doesn't compile.
if (project.hasProperty('broken')) {
    sourceSets.main.java.srcDir 'src/broken/java'
}
